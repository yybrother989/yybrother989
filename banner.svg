<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" role="img" aria-label="Leo Gao — AI Engineer building multi-agent systems. Shipped Chorus AI. Working in Python, TypeScript, Swift, LangGraph, FastAPI, Next.js, Postgres. Interested in agent orchestration, financial data infrastructure, retrieval and reasoning.">
  <defs>
    <clipPath id="cp-metaleft">
      <rect x="0" y="0" width="0" height="60">
        <animate attributeName="width" from="0" to="260" begin="0.3s" dur="0.5s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="cp-name">
      <rect x="40" y="70" width="0" height="110">
        <animate attributeName="width" from="0" to="360" begin="0.8s" dur="0.9s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="cp-subtitle">
      <rect x="44" y="180" width="0" height="28">
        <animate attributeName="width" from="0" to="640" begin="1.7s" dur="0.6s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="cp-ticker-region">
      <rect x="44" y="212" width="1112" height="24"/>
    </clipPath>
    <clipPath id="cp-tagline">
      <rect x="40" y="258" width="0" height="30">
        <animate attributeName="width" from="0" to="480" begin="2.3s" dur="1.0s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="cp-stack">
      <rect x="40" y="490" width="0" height="30">
        <animate attributeName="width" from="0" to="640" begin="4.3s" dur="1.0s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="640" fill="#0b0f14"/>

  <line x1="0" y1="44" x2="0" y2="44" stroke="#1f2a37" stroke-width="1">
    <animate attributeName="x2" from="0" to="1200" begin="0s" dur="0.45s" fill="freeze"/>
  </line>

  <g clip-path="url(#cp-metaleft)">
    <text x="40" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6b7280" letter-spacing="3">RESEARCH · TERMINAL · 01</text>
  </g>

  <text x="1160" y="28" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6b7280" letter-spacing="3" text-anchor="end" opacity="0">YYZ · LIVE<animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.5s" fill="freeze"/></text>

  <g clip-path="url(#cp-name)">
    <text x="40" y="156" font-family="Georgia,'Times New Roman',Times,serif" font-size="96" font-weight="400" fill="#f5f3ef" letter-spacing="-4">Leo Gao</text>
  </g>

  <g clip-path="url(#cp-subtitle)">
    <text x="44" y="198" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#ff7a00" letter-spacing="5">AI ENGINEER · MULTI-AGENT SYSTEMS · TORONTO</text>
  </g>

  <g clip-path="url(#cp-ticker-region)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.4s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-935,0" begin="2.2s" dur="22s" repeatCount="indefinite"/>
      <text x="44" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6b7280" letter-spacing="2">CHORUS <tspan fill="#22c55e" font-size="12">▲<animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/></tspan> LIVE · LANGGRAPH · FASTAPI · SWIFT · NEXT.JS · POSTGRES · AGENT ORCHESTRATION · </text>
      <text x="979" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6b7280" letter-spacing="2">CHORUS <tspan fill="#22c55e" font-size="12">▲<animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/></tspan> LIVE · LANGGRAPH · FASTAPI · SWIFT · NEXT.JS · POSTGRES · AGENT ORCHESTRATION · </text>
    </g>
  </g>

  <line x1="0" y1="252" x2="0" y2="252" stroke="#1f2a37" stroke-width="1">
    <animate attributeName="x2" from="0" to="1200" begin="2.2s" dur="0.45s" fill="freeze"/>
  </line>

  <g clip-path="url(#cp-tagline)">
    <text x="40" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#9ca3af">
      <tspan fill="#ff7a00">&gt;</tspan> I build systems that <tspan font-weight="700" fill="#f5f3ef">do</tspan> work — not chat about it.<tspan fill="#f5f3ef" font-weight="700" dx="4">█<animate attributeName="opacity" values="1;0;1" begin="3.3s" dur="1.1s" repeatCount="indefinite"/></tspan>
    </text>
  </g>

  <g transform="translate(0,12)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.55s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0,12" to="0,0" begin="3.4s" dur="0.55s" fill="freeze"/>
    <text x="40" y="342" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6b7280" letter-spacing="3">─── SHIPPED</text>
    <text x="40" y="382" font-family="Georgia,'Times New Roman',Times,serif" font-size="17" fill="#f5f3ef">
      <tspan fill="#ff7a00" font-weight="700">▸</tspan>&#160;&#160;<tspan font-weight="700">Chorus AI</tspan><tspan fill="#9ca3af">&#160;&#160;—&#160;&#160;Autonomous research system that deploys 14 specialized AI analysts</tspan>
    </text>
    <text x="40" y="410" font-family="Georgia,'Times New Roman',Times,serif" font-size="17" fill="#9ca3af">to investigate any stock. Not a chatbot. A multi-agent pipeline with portfolio-aware insight.</text>
    <text x="40" y="438" font-family="Georgia,'Times New Roman',Times,serif" font-size="17" fill="#9ca3af">Live on web + iOS.</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.4s" fill="freeze"/>
    <text x="40" y="484" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6b7280" letter-spacing="3">─── WORKING IN</text>
  </g>

  <g clip-path="url(#cp-stack)">
    <text x="40" y="512" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#c8cdd4" letter-spacing="1">Python · TypeScript · Swift · LangGraph · FastAPI · Next.js · Postgres</text>
  </g>

  <g transform="translate(0,12)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.3s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0,12" to="0,0" begin="5.3s" dur="0.6s" fill="freeze"/>
    <text x="40" y="560" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#6b7280" letter-spacing="3">─── INTERESTED IN</text>
    <text x="40" y="594" font-family="Georgia,'Times New Roman',Times,serif" font-size="17" fill="#9ca3af">Agent orchestration beyond single-LLM calls · Financial data infrastructure</text>
    <text x="40" y="622" font-family="Georgia,'Times New Roman',Times,serif" font-size="17" fill="#9ca3af">The seam between retrieval, reasoning, and tools</text>
  </g>
</svg>
